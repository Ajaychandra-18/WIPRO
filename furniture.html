<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Furniture Store Catalog</title>
    <style>
        body {
            background-color: #f5f5f5;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        h1 {
            font-size: 2em;
            margin-bottom: 5px;
        }
        p {
            color: #555;
        }
        .products {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-top: 30px;
        }
        .card {
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 8px;
            width: 250px;
            padding: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            text-align: left;
        }
        .card img {
            width: 100%;
            height: auto;
            border-radius: 5px;
        }
        .card h3 {
            margin: 10px 0 5px;
            font-size: 1.2em;
        }
        .price {
            font-weight: bold;
            margin: 10px 0;
        }
        .btn {
            display: inline-block;
            padding: 10px 15px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            text-align: center;
            cursor: pointer;
            text-decoration: none;
        }
        .btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <h1>Furniture Store Catalog</h1>
    <p>Find the best furniture for your home</p>

    <div class="products">
        <!-- Sofa card with inline background color -->
        <div class="card" style="background-color: #fef9e7;">
            <img src="images/sofa.jpeg" alt="Sofa">
            <h3>Sofa</h3>
            <p>Comfortable and stylish sofa</p>
            <div class="price">$499</div>
            <a href="#" class="btn">Buy Now</a>
        </div>

        <!-- Dining table card with inline text color -->
        <div class="card">
            <img src="images/dining table.jpg" alt="Dining Table">
            <h3 style="color: darkgreen;">Dining Table</h3>
            <p>Wooden dining table</p>
            <div class="price">$299</div>
            <a href="#" class="btn">Buy Now</a>
        </div>

        <!-- Chair card with inline button style -->
        <div class="card">
            <img src="images/gaming chair.jpeg" alt="Chair">
            <h3>Chair</h3>
            <p>Modern chair for any room</p>
            <div class="price">$149</div>
            <a href="#" class="btn" style="background-color: black; color: white;">Buy Now</a>
        </div>
    </div>

</body>
</html>
